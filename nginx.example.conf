# Example nginx configuration for Claude Code WebUI
# Place this in your nginx sites-available directory or include it in your main config
#
# This configuration handles:
# - HTTPS termination with proper header forwarding
# - WebSocket upgrades for Socket.IO
# - Static file caching

# Upstream for the backend container
upstream claude_webui {
    server 127.0.0.1:3001;
    # Or if using Docker network:
    # server claude-code-webui:3001;
}

server {
    listen 80;
    server_name your-domain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL Configuration
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logging
    access_log /var/log/nginx/claude-webui.access.log;
    error_log /var/log/nginx/claude-webui.error.log;

    # Increase timeout for long-running Claude sessions
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Main proxy configuration
    location / {
        proxy_pass http://claude_webui;

        # Required for proper protocol detection
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Required for WebSocket (Socket.IO)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
    }

    # Socket.IO specific configuration
    location /socket.io/ {
        proxy_pass http://claude_webui;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
