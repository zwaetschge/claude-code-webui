# Docker Compose file for pulling from Docker Hub
# Usage: docker-compose -f docker-compose.hub.yml up -d
#
# Before running, create a .env file with:
#   SESSION_SECRET=your-session-secret-at-least-32-characters
#   JWT_SECRET=your-jwt-secret-at-least-32-characters

services:
  claude-code-webui:
    image: valentin2177/claude-code-webui:latest
    container_name: claude-code-webui
    restart: unless-stopped
    ports:
      - "5174:3001"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-changeme-session-secret-at-least-32-chars}
      - JWT_SECRET=${JWT_SECRET:-changeme-jwt-secret-at-least-32-chars}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5174}
      - ALLOWED_BASE_PATHS=${ALLOWED_BASE_PATHS:-/home}
      - CLAUDE_USER_EMAIL=${CLAUDE_USER_EMAIL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLI_PROVIDER_CLAUDE_MODELS=${CLI_PROVIDER_CLAUDE_MODELS:-opus,sonnet,haiku}
      - CLI_PROVIDER_CODEX_MODELS=${CLI_PROVIDER_CODEX_MODELS:-}
      - CLI_PROVIDER_GEMINI_MODELS=${CLI_PROVIDER_GEMINI_MODELS:-}
      - CLI_PROVIDER_GLM_MODELS=${CLI_PROVIDER_GLM_MODELS:-glm-4.7,glm-4.5}
      - CLI_PROVIDER_GLM_CREDENTIALS_PATH=${CLI_PROVIDER_GLM_CREDENTIALS_PATH:-/home/node/.glm}
      - CLI_PROVIDER_GLM_PREFIX=${CLI_PROVIDER_GLM_PREFIX:-/home/node/.npm-glm}
      - CLI_PROVIDER_GLM_COMMAND=${CLI_PROVIDER_GLM_COMMAND:-/home/node/.npm-glm/bin/claude}
      - WEBUI_GLM_CONFIG_HOME=${WEBUI_GLM_CONFIG_HOME:-/home/node/.glm}
      # CLI auto-update (optional)
      - CLI_AUTO_UPDATE=${CLI_AUTO_UPDATE:-true}
      - CLI_AUTO_UPDATE_INTERVAL_HOURS=${CLI_AUTO_UPDATE_INTERVAL_HOURS:-24}
      - CLI_AUTO_UPDATE_PROVIDERS=${CLI_AUTO_UPDATE_PROVIDERS:-}
    volumes:
      # Persist database
      - claude-data:/app/packages/backend/data
      # Mount Claude credentials from host
      - ${HOME}/.claude:/home/node/.claude
      # Optional: Mount Gemini config
      - ${HOME}/.gemini:/home/node/.gemini
      # Optional: Mount GLM config
      - ${HOME}/.glm:/home/node/.glm
      # Persist GLM Claude Code CLI prefix
      - ${HOME}/.npm-glm:/home/node/.npm-glm
      # Persist npm global installs (CLI updates)
      - ${HOME}/.npm-global:/home/node/.npm-global
      # Mount your project directories (adjust as needed)
      - ${HOME}:/home/hostuser
      # Optional: Docker socket for container access
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - claude-network

volumes:
  claude-data:

networks:
  claude-network:
    driver: bridge
