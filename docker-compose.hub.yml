# Docker Compose file for pulling from Docker Hub
# Usage: docker-compose -f docker-compose.hub.yml up -d
#
# Before running, create a .env file with:
#   SESSION_SECRET=your-session-secret-at-least-32-characters
#   JWT_SECRET=your-jwt-secret-at-least-32-characters

services:
  claude-code-webui:
    image: valentin2177/claude-code-webui:latest
    container_name: claude-code-webui
    restart: unless-stopped
    ports:
      - '5174:3001'
    shm_size: '${WEBUI_SHM_SIZE:-1gb}'
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-Europe/Zurich}
      - CODEX_WEBUI_SANDBOX_MODE=${CODEX_WEBUI_SANDBOX_MODE:-danger-full-access}
      - CODEX_WEBUI_APPROVAL_POLICY=${CODEX_WEBUI_APPROVAL_POLICY:-never}
      - CHROME_BIN=${CHROME_BIN:-/usr/local/bin/plum-chromium}
      - CHROMIUM_BIN=${CHROMIUM_BIN:-/usr/local/bin/plum-chromium}
      - CHROMIUM_PATH=${CHROMIUM_PATH:-/usr/local/bin/plum-chromium}
      - BROWSER=${BROWSER:-/usr/local/bin/plum-chromium}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-/usr/local/bin/plum-chromium}
      - PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE_PATH:-/usr/local/bin/plum-chromium}
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=${PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD:-1}
      - PUPPETEER_SKIP_DOWNLOAD=${PUPPETEER_SKIP_DOWNLOAD:-1}
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=${PUPPETEER_SKIP_CHROMIUM_DOWNLOAD:-1}
      - SESSION_SECRET=${SESSION_SECRET:-changeme-session-secret-at-least-32-chars}
      - JWT_SECRET=${JWT_SECRET:-changeme-jwt-secret-at-least-32-chars}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5174}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      - ALLOWED_BASE_PATHS=${ALLOWED_BASE_PATHS:-/workspace}
      - AUTH_ALLOWED_EMAILS=${AUTH_ALLOWED_EMAILS:-}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
      - CLI_PROVIDER_CLAUDE_MODELS=${CLI_PROVIDER_CLAUDE_MODELS:-opus,sonnet,haiku}
      - CLI_PROVIDER_CODEX_MODELS=${CLI_PROVIDER_CODEX_MODELS:-}
      - CLI_PROVIDER_OPENCODE_MODELS=${CLI_PROVIDER_OPENCODE_MODELS:-}
      - CLI_PROVIDER_OPENCODE_DEFAULT_MODEL=${CLI_PROVIDER_OPENCODE_DEFAULT_MODEL:-z-ai/glm-5.1}
      - CLI_PROVIDER_VIBE_MODELS=${CLI_PROVIDER_VIBE_MODELS:-}
      - CLI_PROVIDER_VIBE_DEFAULT_MODEL=${CLI_PROVIDER_VIBE_DEFAULT_MODEL:-mistral-vibe-cli-latest}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENCODE_DEBUG_EVENTS=${OPENCODE_DEBUG_EVENTS:-0}
      # CLI auto-update (optional)
      - CLI_AUTO_UPDATE=${CLI_AUTO_UPDATE:-true}
      - CLI_AUTO_UPDATE_INTERVAL_HOURS=${CLI_AUTO_UPDATE_INTERVAL_HOURS:-24}
      - CLI_AUTO_UPDATE_PROVIDERS=${CLI_AUTO_UPDATE_PROVIDERS:-}
    volumes:
      # Persist database
      - claude-data:/app/packages/backend/data
      # Mount Claude credentials from host
      - ${HOME}/.claude:/home/node/.claude
      # Mount Codex, OpenCode, and Vibe credentials from host
      - ${HOME}/.codex:/home/node/.codex
      - ${HOME}/.opencode:/home/node/.opencode
      - ${HOME}/.vibe:/home/node/.vibe
      # Persist npm global installs (CLI updates)
      - ${HOME}/.npm-global:/home/node/.npm-global
      # Mount your project directories (adjust as needed)
      - ${HOME}:/workspace
      # Optional: Docker socket for container access
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - claude-network

volumes:
  claude-data:

networks:
  claude-network:
    driver: bridge
