<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic — design preview · 400×300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     COSMIC DESIGN SYSTEM — 400×300 THUMBNAIL
     Sci-fi · dark space · neon glow · Audiowide techno display
     ============================================================ */
  :root {
    /* Neon accents — extended for cosmic vibe */
    --co-cyan: #00E5FF;
    --co-cyan-soft: #4DEEFF;
    --co-magenta: #FF2D9B;
    --co-magenta-soft: #FF6BB8;
    --co-violet: #8B5CF6;
    --co-blue: #3B82F6;
    --co-lime: #B6FF3C;
    --co-amber: #FFB800;

    /* Deep space surfaces */
    --co-space: #04050E;           /* deep void */
    --co-space-2: #0A0D1F;
    --co-space-3: #131831;
    --co-panel: rgba(20,26,55,0.55);
    --co-panel-2: rgba(28,35,70,0.65);
    --co-line: rgba(0,229,255,0.22);
    --co-line-2: rgba(139,92,246,0.22);
    --co-grid: rgba(0,229,255,0.06);

    --co-ink: #E8ECFF;
    --co-ink-2: #B8BFE0;
    --co-ink-3: #7A82A8;
    --co-ink-4: #4D537A;

    --co-font-display: 'Audiowide', 'Orbitron', sans-serif;
    --co-font-mono: 'JetBrains Mono', ui-monospace, monospace;

    /* Glow shadows — signature */
    --co-glow-cyan: 0 0 18px rgba(0,229,255,0.55), 0 0 4px rgba(0,229,255,0.8);
    --co-glow-magenta: 0 0 18px rgba(255,45,155,0.55), 0 0 4px rgba(255,45,155,0.8);
    --co-glow-violet: 0 0 16px rgba(139,92,246,0.55), 0 0 4px rgba(139,92,246,0.8);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 400px;
    height: 300px;
    overflow: hidden;
  }

  body {
    font-family: var(--co-font-mono);
    font-size: 12px;
    color: var(--co-ink);
    background: var(--co-space);
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    width: 400px;
    height: 300px;
    position: relative;
    overflow: hidden;
    background:
      /* starfield — small white dots scattered */
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,0.85), transparent 50%),
      radial-gradient(1px 1px at 78% 22%, rgba(255,255,255,0.7), transparent 50%),
      radial-gradient(1.5px 1.5px at 32% 64%, rgba(200,230,255,0.75), transparent 50%),
      radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,0.6), transparent 50%),
      radial-gradient(1px 1px at 56% 14%, rgba(255,200,230,0.7), transparent 50%),
      radial-gradient(1.5px 1.5px at 18% 88%, rgba(255,255,255,0.8), transparent 50%),
      radial-gradient(1px 1px at 92% 56%, rgba(200,200,255,0.6), transparent 50%),
      radial-gradient(1px 1px at 6% 52%, rgba(255,255,255,0.5), transparent 50%),
      radial-gradient(1.5px 1.5px at 68% 92%, rgba(255,255,255,0.7), transparent 50%),
      radial-gradient(1px 1px at 44% 38%, rgba(180,200,255,0.6), transparent 50%),
      /* nebula glows */
      radial-gradient(180px 120px at 90% 0%, rgba(255,45,155,0.18), transparent 60%),
      radial-gradient(180px 120px at 10% 100%, rgba(0,229,255,0.15), transparent 60%),
      radial-gradient(220px 160px at 50% 50%, rgba(139,92,246,0.10), transparent 60%),
      var(--co-space);
    display: grid;
    grid-template-rows: 28px 1fr 22px;
  }

  /* Grid overlay (HUD lines) */
  .poster::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, var(--co-grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--co-grid) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }

  /* ============ HUD HEADER ============ */
  .hud {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid var(--co-line);
    background: rgba(4,5,14,0.6);
    backdrop-filter: blur(6px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--co-font-display);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--co-cyan);
    text-shadow: var(--co-glow-cyan);
  }
  .brand__mark {
    width: 16px; height: 16px;
    border: 1.5px solid var(--co-cyan);
    transform: rotate(45deg);
    display: inline-block;
    box-shadow: var(--co-glow-cyan);
    position: relative;
  }
  .brand__mark::after {
    content: "";
    position: absolute;
    inset: 3px;
    background: var(--co-cyan);
    box-shadow: var(--co-glow-cyan);
  }

  .hud__status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--co-font-mono);
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--co-ink-3);
  }
  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .status-dot::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--co-lime);
    box-shadow: 0 0 8px var(--co-lime);
  }
  .status-dot--magenta::before {
    background: var(--co-magenta);
    box-shadow: 0 0 8px var(--co-magenta);
  }
  .hud__sep { color: var(--co-ink-4); }

  /* ============ STAGE ============ */
  .stage {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 12px;
    padding: 14px;
    align-items: center;
    overflow: hidden;
  }

  /* LEFT: cosmic headline */
  .hero {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .hero__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--co-font-mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--co-magenta);
    text-shadow: var(--co-glow-magenta);
    align-self: flex-start;
  }
  .hero__eyebrow::before {
    content: "";
    width: 20px; height: 1px;
    background: var(--co-magenta);
    box-shadow: var(--co-glow-magenta);
  }

  .hero__title {
    font-family: var(--co-font-display);
    font-size: 36px;
    line-height: 0.95;
    letter-spacing: 0.01em;
    color: var(--co-ink);
    margin: 4px 0;
    text-shadow: 0 0 24px rgba(0,229,255,0.35);
  }
  .hero__title-accent {
    color: var(--co-cyan);
    text-shadow: var(--co-glow-cyan);
  }
  .hero__title-magenta {
    color: var(--co-magenta);
    text-shadow: var(--co-glow-magenta);
  }

  .hero__sub {
    font-family: var(--co-font-mono);
    font-size: 10px;
    line-height: 1.5;
    color: var(--co-ink-2);
    max-width: 30ch;
    letter-spacing: 0.02em;
  }

  .hero__cta {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  /* Neon buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 14px;
    border: 1.5px solid var(--co-cyan);
    background: rgba(0,229,255,0.08);
    color: var(--co-cyan);
    font-family: var(--co-font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    box-shadow: var(--co-glow-cyan), inset 0 0 12px rgba(0,229,255,0.15);
    transition: all .18s ease;
  }
  .btn:hover {
    background: rgba(0,229,255,0.18);
    transform: translateY(-1px);
  }
  .btn--ghost {
    border-color: var(--co-ink-4);
    background: transparent;
    color: var(--co-ink-2);
    box-shadow: none;
  }
  .btn--ghost:hover {
    border-color: var(--co-magenta);
    color: var(--co-magenta);
    box-shadow: var(--co-glow-magenta);
  }
  .btn svg { width: 10px; height: 10px; }

  /* RIGHT: holographic stat panel */
  .holo {
    background: var(--co-panel);
    border: 1px solid var(--co-line);
    border-radius: 8px;
    padding: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 20px rgba(0,229,255,0.15),
      inset 0 0 24px rgba(0,229,255,0.05);
  }
  /* Corner brackets — HUD signature */
  .holo::before, .holo::after {
    content: "";
    position: absolute;
    width: 12px; height: 12px;
    border: 2px solid var(--co-cyan);
    box-shadow: var(--co-glow-cyan);
  }
  .holo::before {
    top: -1px; left: -1px;
    border-right: none; border-bottom: none;
  }
  .holo::after {
    bottom: -1px; right: -1px;
    border-left: none; border-top: none;
  }

  .holo__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .holo__title {
    font-family: var(--co-font-mono);
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--co-cyan);
    text-shadow: 0 0 6px rgba(0,229,255,0.5);
  }
  .holo__live {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--co-font-mono);
    font-size: 8px;
    font-weight: 700;
    color: var(--co-lime);
    text-shadow: 0 0 6px var(--co-lime);
  }
  .holo__live::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--co-lime);
    box-shadow: 0 0 6px var(--co-lime);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .holo__value {
    font-family: var(--co-font-display);
    font-size: 28px;
    line-height: 1;
    color: var(--co-ink);
    margin: 6px 0 2px;
    text-shadow: 0 0 16px rgba(0,229,255,0.5);
    letter-spacing: 0.01em;
  }
  .holo__value span {
    font-family: var(--co-font-mono);
    font-size: 11px;
    color: var(--co-ink-3);
    font-weight: 500;
    margin-left: 4px;
  }
  .holo__delta {
    font-family: var(--co-font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--co-lime);
    text-shadow: 0 0 6px rgba(182,255,60,0.5);
  }

  /* Neon bar chart */
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 28px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--co-line);
  }
  .bar {
    flex: 1;
    background: linear-gradient(180deg, var(--co-cyan), rgba(0,229,255,0.2));
    border-radius: 2px 2px 0 0;
    min-height: 2px;
    box-shadow: 0 0 8px rgba(0,229,255,0.4);
  }
  .bar--peak {
    background: linear-gradient(180deg, var(--co-magenta), rgba(255,45,155,0.2));
    box-shadow: var(--co-glow-magenta);
  }

  /* Mini orbital rings decoration in hero corner */
  .orbit {
    position: absolute;
    top: 50%; right: -30px;
    width: 90px; height: 90px;
    transform: translateY(-50%);
    z-index: 0;
    opacity: 0.5;
  }
  .orbit::before, .orbit::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid var(--co-cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(0,229,255,0.4);
  }
  .orbit::after {
    inset: 15px;
    border-color: var(--co-magenta);
    box-shadow: 0 0 6px rgba(255,45,155,0.4);
  }

  /* ============ HUD FOOTER ============ */
  .footer {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-top: 1px solid var(--co-line);
    background: rgba(4,5,14,0.6);
    backdrop-filter: blur(6px);
    font-family: var(--co-font-mono);
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--co-ink-4);
  }
  .footer__center {
    color: var(--co-cyan);
    text-shadow: 0 0 6px rgba(0,229,255,0.5);
  }
</style>
</head>
<body>

<main class="poster" aria-label="Cosmic design language preview">

  <!-- ===== HUD HEADER ===== -->
  <header class="hud">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span>NOVA-7</span>
    </div>
    <div class="hud__status">
      <span class="status-dot">online</span>
      <span class="hud__sep">//</span>
      <span>orbit · 548km</span>
      <span class="hud__sep">//</span>
      <span class="status-dot status-dot--magenta">relay</span>
    </div>
  </header>

  <!-- ===== STAGE ===== -->
  <section class="stage">

    <div class="orbit" aria-hidden="true"></div>

    <!-- LEFT: cosmic headline -->
    <article class="hero">
      <span class="hero__eyebrow">Sector 04 · Active</span>
      <h1 class="hero__title">
        <span class="hero__title-accent">DEEP</span><br>
        SIGNAL<br>
        <span class="hero__title-magenta">NETWORK</span>
      </h1>
      <p class="hero__sub">Real-time telemetry across 14 orbital relays. Quantum-grade sync, zero drift.</p>
      <div class="hero__cta">
        <button class="btn" type="button">
          Engage
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="btn btn--ghost" type="button">Scan</button>
      </div>
    </article>

    <!-- RIGHT: holographic stat panel -->
    <aside class="holo">
      <div class="holo__head">
        <span class="holo__title">Telemetry</span>
        <span class="holo__live">live</span>
      </div>
      <div class="holo__value">98.7<span>% sync</span></div>
      <div class="holo__delta">+0.4 since orbit pass</div>

      <div class="bars" aria-hidden="true">
        <div class="bar" style="height:35%"></div>
        <div class="bar" style="height:58%"></div>
        <div class="bar" style="height:42%"></div>
        <div class="bar" style="height:72%"></div>
        <div class="bar bar--peak" style="height:100%"></div>
        <div class="bar" style="height:65%"></div>
        <div class="bar" style="height:48%"></div>
      </div>
    </aside>

  </section>

  <!-- ===== HUD FOOTER ===== -->
  <footer class="footer">
    <span>cosmic · neon · spatial</span>
    <span class="footer__center">— audiowide · glow —</span>
    <span>WCAG AA · v1</span>
  </footer>

</main>

</body>
</html>
