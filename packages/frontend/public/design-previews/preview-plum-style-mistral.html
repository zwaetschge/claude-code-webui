<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Plum Style Mistral Preview</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 400px;
    height: 300px;
    overflow: hidden;
    background: #040302;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: #fff7ed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .frame {
    position: relative;
    width: 400px;
    height: 300px;
    /* Dark glass workbench — amber hint at the edge, magenta spark top-right, never a brown wash */
    background:
      radial-gradient(120% 100% at 0% 0%, rgba(255,198,109,0.05) 0%, rgba(255,198,109,0) 45%),
      radial-gradient(60% 50% at 100% 0%, rgba(244,114,182,0.045) 0%, rgba(244,114,182,0) 55%),
      linear-gradient(180deg, #0d0907 0%, #090604 60%, #040302 100%);
    overflow: hidden;
  }

  /* ---------- Left Rail ---------- */
  .rail {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 48px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 0;
    background: linear-gradient(90deg, rgba(255,198,109,0.022) 0%, rgba(255,198,109,0) 100%);
    box-shadow: inset -1px 0 0 rgba(255,198,109,0.1);
    z-index: 3;
  }

  .brand {
    width: 30px; height: 30px; border-radius: 999px;
    display: grid; place-items: center; margin-bottom: 6px;
    background: rgba(255,198,109,0.05);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.2), 0 0 14px rgba(255,122,110,0.18);
    color: #ffc66d;
    /* tiny magenta spark on the edge only */
    position: relative;
  }
  .brand::after {
    content: ""; position: absolute;
    top: 2px; right: 2px;
    width: 4px; height: 4px; border-radius: 999px;
    background: #f472b6;
    box-shadow: 0 0 5px rgba(244,114,182,0.8);
  }
  .brand svg { width: 16px; height: 16px; }

  .icon-btn {
    width: 30px; height: 30px; border-radius: 999px;
    display: grid; place-items: center;
    color: rgba(255,237,213,0.5);
    cursor: pointer; position: relative;
    transition: color 130ms ease, background 130ms ease, box-shadow 130ms ease;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { color: #fff7ed; background: rgba(255,198,109,0.06); }
  .icon-btn.active {
    color: #090604;
    background: linear-gradient(135deg, #ffc66d 0%, #ff7a6e 130%);
    box-shadow: 0 0 0 1px rgba(255,198,109,0.4), 0 0 16px rgba(255,122,110,0.28);
  }
  .icon-btn .dot {
    position: absolute; top: 4px; right: 4px;
    width: 6px; height: 6px; border-radius: 999px;
    background: #ffc66d; box-shadow: 0 0 6px rgba(255,198,109,0.7);
  }

  .rail-spacer { flex: 1; }

  .avatar {
    width: 28px; height: 28px; border-radius: 999px;
    background: linear-gradient(135deg, #2a1c14 0%, #16100b 100%);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.2);
    display: grid; place-items: center;
    color: rgba(255,237,213,0.78);
    font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: absolute;
    left: 48px; top: 0; right: 0; bottom: 0;
    padding: 14px 16px 14px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .title-block { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .eyebrow {
    font-size: 8.5px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(255,237,213,0.45);
  }
  .title {
    font-size: 14px; font-weight: 600; letter-spacing: -0.1px;
    color: #fff7ed;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.25;
  }
  .title .dim { color: rgba(255,237,213,0.42); font-weight: 500; }

  .status {
    display: inline-flex; align-items: center; gap: 5px;
    height: 18px; padding: 0 8px 0 6px; border-radius: 999px;
    background: rgba(255,198,109,0.1);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.3);
    font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
    color: #ffc66d;
  }
  .status .pulse {
    width: 5px; height: 5px; border-radius: 999px;
    background: #ffc66d; box-shadow: 0 0 6px rgba(255,198,109,0.85);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ---------- Glass panel: runtime rows ---------- */
  .panel {
    position: relative;
    border-radius: 18px;
    padding: 11px 12px 12px;
    background: rgba(24,16,12,0.68);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      inset 0 0 0 1px rgba(255,198,109,0.13),
      0 8px 24px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  /* Slim amber progress glint — communicates momentum, not decoration */
  .glint {
    position: absolute; left: 0; right: 0; top: 0; height: 1.5px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,198,109,0.2) 20%,
      #ffc66d 50%,
      rgba(244,114,182,0.6) 75%,
      transparent 100%);
    box-shadow: 0 0 8px rgba(255,198,109,0.55);
    transform: translateX(-100%);
    animation: glide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes glide {
    0%   { transform: translateX(-100%); }
    60%  { transform: translateX(100%); }
    100% { transform: translateX(100%); }
  }

  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 9px;
  }
  .panel-title {
    font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    color: rgba(255,237,213,0.62); text-transform: uppercase;
  }
  .panel-sub {
    font-size: 8.5px; font-weight: 600; letter-spacing: 0.2px;
    color: rgba(255,237,213,0.42);
  }

  /* Compact runtime rows: model + profile + trust (visible, never hidden in menus) */
  .rows {
    display: flex; flex-direction: column; gap: 4px;
  }
  .row {
    display: flex; align-items: center; gap: 8px;
    height: 24px;
    padding: 0 9px;
    border-radius: 999px;
    background: rgba(255,198,109,0.035);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.1);
    cursor: pointer;
    position: relative;
    transition: background 130ms ease, box-shadow 130ms ease;
  }
  .row:hover {
    background: rgba(255,198,109,0.06);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.2);
  }
  /* Active runtime row gets amber caret / focus ring only */
  .row.active {
    background: rgba(255,198,109,0.08);
    box-shadow:
      inset 0 0 0 1px rgba(255,198,109,0.3),
      inset 2px 0 0 #ffc66d;
  }
  .row .k {
    font-size: 9px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(255,237,213,0.45);
    width: 44px; flex-shrink: 0;
  }
  .row .v {
    flex: 1; min-width: 0;
    font-size: 10px; font-weight: 600;
    color: #fff7ed;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .v .meta { color: rgba(255,237,213,0.45); font-weight: 500; margin-left: 5px; }
  .row .caret {
    width: 11px; height: 11px; flex-shrink: 0;
    color: rgba(255,237,213,0.45);
  }

  /* Trust pill — explicit, color-coded */
  .trust {
    display: inline-flex; align-items: center; gap: 4px;
    height: 14px; padding: 0 6px; border-radius: 999px;
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.3px;
  }
  .trust.mid {
    color: #ffc66d;
    background: rgba(255,198,109,0.12);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.32);
  }
  .trust .pulse {
    width: 4px; height: 4px; border-radius: 999px;
    background: #ffc66d;
  }

  /* Permission control clearly disabled — not broken, just unsupported */
  .row.disabled {
    opacity: 0.55;
    cursor: not-allowed;
    background: rgba(255,255,255,0.015);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.07);
  }
  .row.disabled:hover {
    background: rgba(255,255,255,0.015);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.07);
  }
  .row.disabled .v { color: rgba(255,237,213,0.5); }
  .row.disabled .lock {
    width: 9px; height: 9px; flex-shrink: 0;
    color: rgba(255,122,110,0.8);
  }

  /* Folded one-shot output — folds naturally into the timeline */
  .turn {
    margin-top: 9px;
    display: flex; gap: 6px; align-items: flex-start;
  }
  .turn .thumb {
    width: 16px; height: 16px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(135deg, #ffc66d 0%, #ff7a6e 130%);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.4), 0 0 8px rgba(255,122,110,0.25);
    display: grid; place-items: center;
    color: #090604;
    font-size: 8px; font-weight: 800; letter-spacing: 0.2px;
  }
  .turn .bubble {
    flex: 1; min-width: 0;
    border-radius: 10px;
    padding: 6px 9px;
    background: rgba(255,198,109,0.04);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.1);
  }
  .turn .bubble .who {
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.3px;
    color: rgba(255,237,213,0.6); text-transform: uppercase;
    margin-bottom: 2px;
  }
  .turn .bubble .txt {
    font-size: 9.5px; line-height: 1.4;
    color: rgba(255,237,213,0.85);
  }
  .turn .bubble .txt .ink { color: #fff7ed; font-weight: 600; }

  /* ---------- Action row ---------- */
  .actions { display: flex; align-items: center; gap: 6px; margin-top: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 11px; border-radius: 999px;
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.2px;
    color: rgba(255,237,213,0.72);
    background: rgba(255,198,109,0.04);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.14);
    cursor: pointer;
    transition: background 130ms ease, box-shadow 130ms ease, color 130ms ease;
  }
  .pill svg { width: 11px; height: 11px; }
  .pill:hover {
    color: #fff7ed;
    background: rgba(255,198,109,0.08);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.3);
  }
  .pill.primary {
    color: #090604;
    background: linear-gradient(135deg, #ffc66d 0%, #ff7a6e 130%);
    box-shadow: 0 0 0 1px rgba(255,198,109,0.4), 0 0 14px rgba(255,122,110,0.25);
  }
  .pill.primary:hover { filter: brightness(1.04); }

  .icon-pill {
    width: 24px; height: 24px; border-radius: 999px;
    display: grid; place-items: center;
    color: rgba(255,237,213,0.5);
    background: rgba(255,198,109,0.03);
    box-shadow: inset 0 0 0 1px rgba(255,198,109,0.12);
    cursor: pointer;
    transition: color 130ms ease, background 130ms ease;
  }
  .icon-pill:hover { color: #fff7ed; background: rgba(255,198,109,0.08); }
  .icon-pill svg { width: 12px; height: 12px; }

  .actions .spacer { flex: 1; }
</style>
</head>
<body>
  <div class="frame">

    <!-- ============ LEFT RAIL ============ -->
    <nav class="rail" aria-label="Werkzeuge">
      <div class="brand" title="Plum · Mistral Vibe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17h4l3-10 3 14 3-10 2 6h3"/>
        </svg>
      </div>
      <button class="icon-btn active" title="Run" aria-label="Run">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h7l-1 8 10-12h-7z"/>
        </svg>
      </button>
      <button class="icon-btn" title="Timeline" aria-label="Timeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M3 12h18M3 18h12"/>
          <circle cx="20" cy="18" r="1.4"/>
        </svg>
        <span class="dot"></span>
      </button>
      <button class="icon-btn" title="Library" aria-label="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4v16M9 4v16M14 5l5 14"/>
        </svg>
      </button>
      <button class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
      </button>
      <div class="rail-spacer"></div>
      <div class="avatar" title="Benutzer">VA</div>
    </nav>

    <!-- ============ MAIN STAGE ============ -->
    <main class="stage">

      <div class="top">
        <div class="title-block">
          <span class="eyebrow">Mistral Vibe · One-Shot</span>
          <h1 class="title">Run <span class="dim">/ vibe-4f2a</span></h1>
        </div>
        <span class="status"><span class="pulse"></span>Streaming</span>
      </div>

      <section class="panel">
        <div class="glint" aria-hidden="true"></div>

        <header class="panel-head">
          <span class="panel-title">Runtime</span>
          <span class="panel-sub">42ms · 1.2k tok/s</span>
        </header>

        <div class="rows">
          <!-- Model: visible, active row -->
          <div class="row active" title="Modell wählen">
            <span class="k">Model</span>
            <span class="v">mistral-large-2411<span class="meta">· 131k ctx</span></span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </div>

          <!-- Profile -->
          <div class="row" title="Profil">
            <span class="k">Profile</span>
            <span class="v">balanced</span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </div>

          <!-- Trust: explicit pill -->
          <div class="row" title="Trust-Profil">
            <span class="k">Trust</span>
            <span class="v">
              standard
              <span class="trust mid"><span class="pulse"></span>0.6</span>
            </span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </div>

          <!-- Permission control clearly disabled — unsupported for Vibe, not broken -->
          <div class="row disabled" title="Nicht verfügbar im Vibe-Modus">
            <span class="k">Perms</span>
            <span class="v">auto-approve</span>
            <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </div>
        </div>

        <!-- Folded one-shot turn -->
        <div class="turn">
          <div class="thumb">M</div>
          <div class="bubble">
            <div class="who">Mistral</div>
            <div class="txt">Schema validiert — <span class="ink">3 Felder</span> übernommen, bereit zum Fortsetzen.</div>
          </div>
        </div>
      </section>

      <div class="actions">
        <button class="pill primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          Run
        </button>
        <button class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Neue Eingabe
        </button>
        <div class="spacer"></div>
        <button class="icon-pill" title="Stop" aria-label="Stop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="icon-pill" title="Mehr" aria-label="Mehr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
