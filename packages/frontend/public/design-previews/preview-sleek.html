<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sleek — design preview · 400×300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     SLEEK DESIGN SYSTEM — 400×300 THUMBNAIL
     Modern minimalist · Inter · 60-30-10 palette rule
     Blue/violet accent · 8pt grid · subtle interactions
     ============================================================ */
  :root {
    --sl-primary:    #3B82F6;   /* blue — interaction */
    --sl-primary-2:  #2563EB;
    --sl-primary-soft: rgba(59,130,246,0.10);
    --sl-secondary:  #8B5CF6;   /* violet — accent */
    --sl-secondary-2:#7C3AED;
    --sl-success:    #16A34A;
    --sl-warning:    #D97706;
    --sl-danger:     #DC2626;

    --sl-surface:    #FFFFFF;
    --sl-surface-2:  #FAFAFA;
    --sl-surface-3:  #F4F4F5;
    --sl-surface-4:  #E5E7EB;

    --sl-ink:        #111827;
    --sl-ink-2:      #1F2937;
    --sl-ink-3:      #4B5563;
    --sl-ink-4:      #6B7280;
    --sl-ink-5:      #9CA3AF;

    --sl-line:       #E5E7EB;
    --sl-line-2:     #F3F4F6;

    --sl-font:    'Inter', -apple-system, 'Segoe UI', sans-serif;
    --sl-font-m:  'JetBrains Mono', ui-monospace, monospace;

    /* sleek = consistent, generous radii */
    --sl-r-sm: 6px;
    --sl-r-md: 10px;
    --sl-r-lg: 14px;
    --sl-r-xl: 20px;
    --sl-r-pill: 999px;

    /* subtle, layered, directional — never harsh */
    --sl-shadow-1: 0 1px 2px rgba(17,24,39,0.04);
    --sl-shadow-2: 0 2px 6px rgba(17,24,39,0.05), 0 1px 2px rgba(17,24,39,0.03);
    --sl-shadow-3: 0 8px 24px rgba(17,24,39,0.07), 0 2px 6px rgba(17,24,39,0.04);
    --sl-shadow-glow: 0 8px 20px -6px rgba(59,130,246,0.40), 0 2px 6px rgba(37,99,235,0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 400px;
    height: 300px;
    overflow: hidden;
  }

  body {
    font-family: var(--sl-font);
    font-size: 12px;
    color: var(--sl-ink);
    background: var(--sl-surface);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  /* ============================================================
     POSTER — flat white, ultra-subtle ambient gradient (60% white)
     ============================================================ */
  .poster {
    position: relative;
    width: 400px;
    height: 300px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 55% 40% at 85% 10%, rgba(59,130,246,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 12% 90%, rgba(139,92,246,0.06) 0%, transparent 60%),
      var(--sl-surface);
    isolation: isolate;
  }

  /* ============================================================
     FRAME — 8pt baseline (everything snaps to multiples of 8)
     ============================================================ */
  .frame {
    position: relative;
    z-index: 2;
    width: 400px;
    height: 300px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 16px 24px 16px;
    gap: 16px;
  }

  /* ============ HEADER ============ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--sl-ink);
  }
  .brand__mark {
    width: 22px; height: 22px;
    border-radius: var(--sl-r-sm);
    background: linear-gradient(135deg, var(--sl-primary) 0%, var(--sl-secondary) 100%);
    position: relative;
    overflow: hidden;
    box-shadow: var(--sl-shadow-glow);
  }
  .brand__mark::after {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 5px;
    background: linear-gradient(180deg, rgba(255,255,255,0.40) 0%, transparent 55%);
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    color: var(--sl-ink-4);
    letter-spacing: -0.01em;
  }
  .nav a {
    text-decoration: none;
    color: inherit;
    padding: 5px 10px;
    border-radius: var(--sl-r-sm);
    transition: color .15s ease, background .15s ease;
  }
  .nav a:hover {
    color: var(--sl-ink);
    background: var(--sl-surface-3);
  }
  .nav a.is-active {
    color: var(--sl-ink);
    font-weight: 600;
  }

  /* ============ STAGE ============ */
  .stage {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 24px;
    align-items: center;
    min-height: 0;
  }

  /* ---- LEFT: hero (restrained, generous) ---- */
  .hero {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .hero__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--sl-font-m);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--sl-primary);
  }
  .hero__eyebrow::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--sl-primary);
    box-shadow: 0 0 0 3px var(--sl-primary-soft);
  }
  .hero__title {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.06;
    letter-spacing: -0.035em;
    color: var(--sl-ink);
  }
  .hero__title em {
    font-style: normal;
    background: linear-gradient(120deg, var(--sl-primary) 0%, var(--sl-secondary) 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero__sub {
    font-size: 11px;
    font-weight: 400;
    line-height: 1.55;
    letter-spacing: -0.005em;
    color: var(--sl-ink-4);
    max-width: 30ch;
  }
  .hero__cta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 32px;
    padding: 0 16px;
    border: none;
    border-radius: var(--sl-r-sm);
    font-family: var(--sl-font);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .btn--primary {
    background: var(--sl-primary);
    color: #FFFFFF;
    box-shadow: var(--sl-shadow-glow);
  }
  .btn--primary:hover {
    background: var(--sl-primary-2);
    transform: translateY(-1px);
    box-shadow: 0 12px 24px -6px rgba(59,130,246,0.50);
  }
  .btn--ghost {
    background: transparent;
    color: var(--sl-ink-3);
    padding: 0 8px;
    height: 32px;
  }
  .btn--ghost:hover { color: var(--sl-ink); background: var(--sl-surface-3); }
  .btn--ghost::after { content: " →"; font-weight: 500; }

  /* ============================================================
     RIGHT: SLEEK STAT CARD
     Minimalist signature — hairline border, soft shadow,
     tabular numbers, gradient sparkline, clean separator.
     ============================================================ */
  .card {
    padding: 16px;
    background: var(--sl-surface);
    border: 1px solid var(--sl-line);
    border-radius: var(--sl-r-lg);
    box-shadow: var(--sl-shadow-3);
    position: relative;
    overflow: hidden;
  }
  /* gradient sheen on top edge */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--sl-primary) 0%, var(--sl-secondary) 100%);
  }

  .card__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card__title {
    font-size: 11px;
    font-weight: 500;
    color: var(--sl-ink-4);
    letter-spacing: -0.005em;
  }
  .card__badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    background: rgba(22,163,74,0.10);
    color: #15803D;
    border-radius: var(--sl-r-pill);
    font-size: 9.5px;
    font-weight: 600;
  }
  .card__badge::before {
    content: "";
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--sl-success);
  }

  .metric {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 12px;
  }
  .metric__value {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--sl-ink);
    font-variant-numeric: tabular-nums;
  }
  .metric__delta {
    display: inline-flex;
    align-items: center;
    font-family: var(--sl-font-m);
    font-size: 10px;
    font-weight: 600;
    color: var(--sl-success);
  }
  .metric__delta::before {
    content: "↑";
    margin-right: 2px;
    font-size: 11px;
  }

  .spark {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 32px;
    margin-bottom: 12px;
  }
  .spark i {
    flex: 1;
    border-radius: 2px 2px 0 0;
    min-height: 3px;
    background: linear-gradient(180deg, var(--sl-primary) 0%, rgba(59,130,246,0.20) 100%);
  }
  .spark i.peak {
    background: linear-gradient(180deg, var(--sl-secondary) 0%, rgba(139,92,246,0.25) 100%);
  }

  .card__row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--sl-line-2);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: var(--sl-surface-3);
    border-radius: var(--sl-r-pill);
    font-size: 9.5px;
    font-weight: 500;
    color: var(--sl-ink-3);
  }
  .meta {
    font-family: var(--sl-font-m);
    font-size: 9px;
    font-weight: 500;
    color: var(--sl-ink-5);
  }

  /* ============ FOOTER ============ */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer__stats {
    display: flex;
    gap: 24px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
    line-height: 1.1;
  }
  .stat__k {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--sl-ink);
    font-variant-numeric: tabular-nums;
  }
  .stat__k span {
    font-size: 9.5px;
    color: var(--sl-ink-4);
    font-weight: 400;
    margin-left: 2px;
  }
  .stat__l {
    font-size: 9.5px;
    font-weight: 500;
    color: var(--sl-ink-5);
    letter-spacing: -0.005em;
  }
  .footer__meta {
    font-family: var(--sl-font-m);
    font-size: 9px;
    font-weight: 500;
    color: var(--sl-ink-5);
  }
  .footer__meta b { color: var(--sl-primary); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<main class="poster" aria-label="Sleek design language preview — modern minimal">

  <div class="frame">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span>Lumina</span>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="#" class="is-active">Product</a>
        <a href="#">Pricing</a>
        <a href="#">Docs</a>
      </nav>
    </header>

    <!-- ===== STAGE ===== -->
    <section class="stage">

      <!-- LEFT: hero -->
      <article class="hero">
        <span class="hero__eyebrow">New · v3.0</span>
        <h1 class="hero__title">Less UI, <em>more flow.</em></h1>
        <p class="hero__sub">A focused workspace that fades into the background — so your work can take the foreground.</p>
        <div class="hero__cta">
          <button class="btn btn--primary" type="button">Get started</button>
          <button class="btn btn--ghost" type="button">Learn more</button>
        </div>
      </article>

      <!-- RIGHT: stat card -->
      <div class="card" aria-label="Active users summary">
        <div class="card__head">
          <span class="card__title">Active users</span>
          <span class="card__badge">Live</span>
        </div>

        <div class="metric">
          <span class="metric__value">12,847</span>
          <span class="metric__delta">12.4%</span>
        </div>

        <div class="spark" aria-hidden="true">
          <i style="height:30%"></i>
          <i style="height:42%"></i>
          <i style="height:36%"></i>
          <i style="height:55%"></i>
          <i style="height:48%"></i>
          <i style="height:64%"></i>
          <i class="peak" style="height:92%"></i>
          <i style="height:78%"></i>
        </div>

        <div class="card__row">
          <span class="chip">↑ Past 7 days</span>
          <span class="meta">Updated · just now</span>
        </div>
      </div>

    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
      <div class="footer__stats">
        <div class="stat">
          <span class="stat__k">99.9<span>%</span></span>
          <span class="stat__l">Uptime</span>
        </div>
        <div class="stat">
          <span class="stat__k">A11y<span> AA</span></span>
          <span class="stat__l">Compliance</span>
        </div>
      </div>
      <span class="footer__meta">Sleek · <b>#3B82F6</b></span>
    </footer>

  </div>

</main>

</body>
</html>
