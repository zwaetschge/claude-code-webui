<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brutalism — design preview · 400×300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     BRUTALISM DESIGN SYSTEM — 400×300 THUMBNAIL PREVIEW
     Raw · anti-design · thick borders · visible grid · no shadows
     ============================================================ */
  :root {
    --br-primary: #DD614C;        /* terracotta */
    --br-secondary: #DAA144;      /* ochre */
    --br-success: #16A34A;
    --br-warning: #D97706;
    --br-danger: #DC2626;
    --br-surface: #FFFFFF;
    --br-paper: #FAF7F2;          /* slightly off-white, like raw paper */
    --br-ink: #111827;
    --br-ink-2: #2A2A2A;
    --br-border: #000000;

    --br-font-display: 'Darker Grotesque', 'Arial Black', sans-serif;
    --br-font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 400px;
    height: 300px;
    overflow: hidden;
  }

  body {
    font-family: var(--br-font-display);
    font-size: 12px;
    color: var(--br-ink);
    background: var(--br-paper);
    -webkit-font-smoothing: antialiased;
  }

  /* Raw grid visible in the background */
  .poster {
    width: 400px;
    height: 300px;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(to right, rgba(17,24,39,0.04) 1px, transparent 1px) 0 0 / 40px 100%,
      linear-gradient(to bottom, rgba(17,24,39,0.04) 1px, transparent 1px) 0 0 / 100% 40px,
      var(--br-paper);
    border: 2px solid var(--br-border);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ===== HEADER STRIP ===== */
  .header {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    border-bottom: 2px solid var(--br-border);
    background: var(--br-surface);
  }
  .header__left {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: -0.02em;
    color: var(--br-ink);
  }
  .header__mark {
    display: inline-block;
    width: 14px; height: 14px;
    background: var(--br-primary);
    border: 1.5px solid var(--br-border);
  }
  .header__right {
    display: flex;
    align-items: stretch;
    border-left: 2px solid var(--br-border);
  }
  .header__tag {
    padding: 4px 8px;
    font-family: var(--br-font-mono);
    font-size: 9px;
    font-weight: 700;
    background: var(--br-secondary);
    color: var(--br-ink);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-left: 2px solid var(--br-border);
  }
  .header__tag:first-child {
    border-left: none;
    background: var(--br-primary);
    color: #fff;
  }

  /* ===== MAIN GRID ===== */
  .main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    border-bottom: 2px solid var(--br-border);
  }

  /* LEFT: massive headline */
  .stage {
    padding: 12px 14px;
    border-right: 2px solid var(--br-border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--br-font-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--br-ink);
    background: var(--br-paper);
    padding: 2px 5px;
    border: 1.5px solid var(--br-border);
    align-self: flex-start;
    margin-bottom: 6px;
  }
  .headline {
    font-family: var(--br-font-display);
    font-weight: 800;
    font-size: 58px;
    line-height: 0.82;
    letter-spacing: -0.05em;
    color: var(--br-ink);
    text-transform: uppercase;
    margin: 4px 0 2px;
    word-break: break-word;
  }
  .headline__accent {
    background: var(--br-primary);
    color: #fff;
    padding: 0 4px;
    display: inline-block;
    transform: rotate(-1.5deg);
  }
  .headline__outline {
    -webkit-text-stroke: 1.5px var(--br-ink);
    color: var(--br-paper);
  }
  .subhead {
    font-family: var(--br-font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--br-ink);
    margin-top: 4px;
    line-height: 1.3;
    max-width: 32ch;
  }
  .subhead::before {
    content: "// ";
    color: var(--br-primary);
    font-weight: 700;
  }

  /* CTA row — raw chunky buttons */
  .actions {
    display: flex;
    gap: 0;
    margin-top: 6px;
    align-items: stretch;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border: 2px solid var(--br-border);
    font-family: var(--br-font-display);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--br-ink);
    background: var(--br-surface);
    transition: none;
  }
  .btn--primary {
    background: var(--br-primary);
    color: #fff;
    box-shadow: 3px 3px 0 var(--br-border);
    margin-right: -2px;
  }
  .btn--primary:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--br-border); }
  .btn--secondary {
    background: var(--br-secondary);
    color: var(--br-ink);
  }
  .btn svg { width: 12px; height: 12px; }

  /* RIGHT: raw data blocks */
  .data {
    display: grid;
    grid-template-rows: auto auto 1fr;
  }
  .data__cell {
    padding: 8px 12px;
    border-bottom: 2px solid var(--br-border);
    background: var(--br-surface);
  }
  .data__cell:last-child { border-bottom: none; }
  .data__cell--accent { background: var(--br-secondary); }
  .data__label {
    font-family: var(--br-font-mono);
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--br-ink);
    margin-bottom: 2px;
    opacity: 0.7;
  }
  .data__value {
    font-family: var(--br-font-display);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--br-ink);
    line-height: 0.95;
  }
  .data__value--big { font-size: 32px; }
  .data__meta {
    font-family: var(--br-font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--br-ink);
    margin-top: 2px;
  }
  .data__meta::before {
    content: "▲ ";
    color: var(--br-success);
  }

  /* Mini raw chart — ASCII-bar style */
  .chart {
    padding: 8px 12px;
    background: var(--br-paper);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chart__row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--br-font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--br-ink);
  }
  .chart__label { width: 22px; opacity: 0.7; }
  .chart__bar {
    flex: 1;
    height: 9px;
    background: var(--br-primary);
    border: 1.5px solid var(--br-border);
  }
  .chart__bar--secondary { background: var(--br-secondary); }
  .chart__bar--ink { background: var(--br-ink); }
  .chart__pct { width: 26px; text-align: right; }

  /* ===== FOOTER ===== */
  .footer {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    background: var(--br-ink);
    color: #fff;
    font-family: var(--br-font-mono);
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .footer__left, .footer__right {
    padding: 4px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .footer__mid {
    padding: 4px 10px;
    background: var(--br-primary);
    color: #fff;
    border-left: 2px solid var(--br-border);
    border-right: 2px solid var(--br-border);
  }
  .footer__dot {
    width: 7px; height: 7px;
    background: var(--br-secondary);
    display: inline-block;
  }

  /* Decorative "stamp" element — anti-design accent */
  .stamp {
    position: absolute;
    top: 12px; right: -8px;
    background: var(--br-ink);
    color: #fff;
    padding: 2px 12px 2px 8px;
    font-family: var(--br-font-mono);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transform: rotate(8deg);
    border: 1.5px solid var(--br-border);
    z-index: 5;
  }
</style>
</head>
<body>

<main class="poster" aria-label="Brutalism design language preview">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header__left">
      <span class="header__mark"></span>
      RAW / INDEX
    </div>
    <div class="header__right">
      <span class="header__tag">no.07</span>
      <span class="header__tag">2025</span>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <section class="main">

    <!-- LEFT: headline stage -->
    <div class="stage">
      <div class="stamp">approved</div>

      <div>
        <span class="eyebrow">★ Brutal · v1</span>
        <h1 class="headline">
          <span class="headline__outline">RAW</span><br>
          <span class="headline__accent">FORM</span>
        </h1>
        <p class="subhead">No polish. No padding. Function stripped to its bones and laid bare on the page.</p>
      </div>

      <div class="actions">
        <button class="btn btn--primary" type="button">
          Enter
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="btn btn--secondary" type="button">Read</button>
      </div>
    </div>

    <!-- RIGHT: raw data stack -->
    <div class="data">

      <div class="data__cell data__cell--accent">
        <div class="data__label">Output</div>
        <div class="data__value data__value--big">94<span style="font-size:16px;">%</span></div>
        <div class="data__meta">+6.2 vs Q2</div>
      </div>

      <div class="data__cell">
        <div class="data__label">Units</div>
        <div class="data__value">2,481</div>
      </div>

      <div class="chart">
        <div class="chart__row">
          <span class="chart__label">A</span>
          <div class="chart__bar"></div>
          <span class="chart__pct">82</span>
        </div>
        <div class="chart__row">
          <span class="chart__label">B</span>
          <div class="chart__bar chart__bar--secondary" style="width:62%"></div>
          <span class="chart__pct">62</span>
        </div>
        <div class="chart__row">
          <span class="chart__label">C</span>
          <div class="chart__bar chart__bar--ink" style="width:38%"></div>
          <span class="chart__pct">38</span>
        </div>
      </div>

    </div>

  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer__left">
      <span class="footer__dot"></span>
      raw · unadorned · functional
    </div>
    <div class="footer__mid">CONCRETE</div>
    <div class="footer__right">
      WCAG AA · 4/8/12/16
    </div>
  </footer>

</main>

</body>
</html>
