<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricardo Marketplace Design Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Ricardo marketplace tokens */
      --primary: #111827;          /* ink */
      --accent: #ea580c;           /* orange — bids, hot */
      --accent-soft: #fff1e8;
      --success: #15803d;          /* bought, verified */
      --success-soft: #e7f4ec;
      --warning: #ca8a04;          /* pending */
      --warning-soft: #fbf3da;
      --danger: #b91c1c;           /* dispute, ending */
      --surface: #fffdf8;          /* warm paper */
      --alt-surface: #f3efe6;      /* warm gray-beige */
      --text: #111827;
      --muted: #5b6472;
      --border: #d6d0c4;
      --border-soft: #e8e2d6;
      --sans: 'Instrument Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 400px;
      height: 300px;
      overflow: hidden;
      background: var(--alt-surface);
      font-family: var(--sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .preview {
      position: relative;
      width: 400px;
      height: 300px;
      padding: 12px;
      background: var(--alt-surface);
      display: grid;
      grid-template-columns: 132px 1fr;
      gap: 0;
      border-radius: 14px;
    }

    /* ---- Image module ---- */
    .media {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 14px 0 0 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .media-frame {
      position: relative;
      flex: 1;
      background:
        radial-gradient(circle at 50% 38%, #4a5466 0%, #2a3142 55%, #161b27 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* Subtle defect-frame guide (the kind of "evidence photo" marketplace) */
    .media-frame::after {
      content: '';
      position: absolute;
      top: 28px;
      right: 14px;
      width: 22px;
      height: 22px;
      border: 1.5px dashed rgba(234, 88, 12, 0.85);
      border-radius: 3px;
      pointer-events: none;
    }

    .camera {
      position: relative;
      width: 72px;
      height: 48px;
      background: linear-gradient(180deg, #1c2230 0%, #0a0d14 100%);
      border-radius: 6px;
      box-shadow:
        0 6px 14px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .camera::before {
      /* lens */
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #6b7689 0%, #2a3142 45%, #0a0d14 100%);
      box-shadow: inset 0 0 0 2px #0a0d14, 0 0 0 3px #1c2230;
    }

    .camera::after {
      /* top prism */
      content: '';
      position: absolute;
      top: -4px;
      right: 8px;
      width: 14px;
      height: 5px;
      background: #0a0d14;
      border-radius: 2px 2px 0 0;
    }

    /* Top status chips overlaying media */
    .media-top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 4px;
      z-index: 2;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 18px;
      padding: 0 6px;
      border-radius: 999px;
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      backdrop-filter: blur(4px);
    }

    .chip.ending {
      background: rgba(185, 28, 28, 0.92);
      color: #fff;
    }
    .chip.ending::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
    }

    .chip.bid {
      background: rgba(17, 24, 39, 0.78);
      color: #fff;
    }

    /* Thumbnail strip */
    .thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      padding: 4px;
      background: var(--surface);
      border-top: 1px solid var(--border-soft);
    }

    .thumb {
      aspect-ratio: 1;
      background: var(--alt-surface);
      border-radius: 4px;
      position: relative;
    }
    .thumb.active {
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }
    .thumb.t2 { background: linear-gradient(135deg, #c9c1ae, #9d9686); }
    .thumb.t3 { background: linear-gradient(135deg, #5b6472, #2a3142); }
    .thumb.t4 { background: linear-gradient(135deg, #d6d0c4, #a8a294); }

    .more {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      color: var(--text);
      background: rgba(255,253,248,0.75);
      border-radius: 4px;
    }

    /* ---- Info panel ---- */
    .info {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 14px 14px 0;
      padding: 10px 12px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .info-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .cat {
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .watch {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: var(--sans);
      font-size: 9.5px;
      font-weight: 600;
      color: var(--muted);
    }
    .watch svg { width: 10px; height: 10px; }

    .title {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .title em {
      font-style: normal;
      color: var(--muted);
      font-weight: 500;
    }

    /* Condition + defects row */
    .cond-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 17px;
      padding: 0 7px;
      border-radius: 999px;
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .pill.good {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid color-mix(in srgb, var(--success) 25%, transparent);
    }
    .pill.good::before {
      content: '';
      width: 5px; height: 5px; border-radius: 50%; background: var(--success);
    }
    .pill.note {
      background: var(--warning-soft);
      color: var(--warning);
      border: 1px solid color-mix(in srgb, var(--warning) 25%, transparent);
    }
    .pill.note::before {
      content: '!';
      font-weight: 800;
      font-size: 10px;
    }

    /* Price block */
    .price-block {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 1px;
    }
    .price {
      font-family: var(--sans);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .price .cur {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-right: 1px;
    }
    .bid-info {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: var(--sans);
      font-size: 9.5px;
      font-weight: 600;
      color: var(--accent);
    }
    .bid-info::before {
      content: '';
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    }

    /* Trust row */
    .trust {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 5px;
      border-top: 1px dashed var(--border);
    }
    .avatar {
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, #ea580c, #b91c1c);
      color: #fff;
      display: grid; place-items: center;
      font-family: var(--sans);
      font-size: 9px; font-weight: 800;
      flex: 0 0 18px;
    }
    .seller {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .seller .name {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .seller .name .check {
      display: inline-block;
      width: 9px; height: 9px;
      margin-left: 2px;
      vertical-align: -1px;
    }
    .seller .sub {
      font-family: var(--mono);
      font-size: 7.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .seller .sub b { color: var(--success); font-weight: 700; }

    .ship {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }
    .ship svg { width: 10px; height: 10px; color: var(--muted); }

    /* Footer actions */
    .actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }
    .btn {
      flex: 1;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 10px;
      border-radius: 8px;
      border: none;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.005em;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #c2460a; }
    .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn-ghost {
      flex: 0 0 28px;
      background: var(--alt-surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost svg { width: 12px; height: 12px; }

    /* Timer bar */
    .timer {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      color: var(--danger);
    }
    .timer .clock {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .timer .clock svg { width: 10px; height: 10px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="preview">

    <!-- Media module -->
    <div class="media">
      <div class="media-top">
        <span class="chip ending">Ends 2h 14m</span>
        <span class="chip bid">12 bids</span>
      </div>
      <div class="media-frame">
        <div class="camera" aria-hidden="true"></div>
      </div>
      <div class="thumbs">
        <div class="thumb active"></div>
        <div class="thumb t2"></div>
        <div class="thumb t3"></div>
        <div class="thumb t4"><span class="more">+9</span></div>
      </div>
    </div>

    <!-- Info panel -->
    <div class="info">
      <div class="info-top">
        <span class="cat">Photo · Vintage</span>
        <span class="watch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          38
        </span>
      </div>

      <h2 class="title">Leica M6 <em>Black Paint · 1986</em></h2>

      <div class="cond-row">
        <span class="pill good">Used · Good</span>
        <span class="pill note">Brassing on edges</span>
      </div>

      <div class="price-block">
        <span class="price"><span class="cur">CHF</span>2,180</span>
        <span class="bid-info">+ CHF 40 last bid</span>
      </div>

      <div class="trust">
        <div class="avatar" aria-hidden="true">A</div>
        <div class="seller">
          <span class="name">
            alpen.cams
            <svg class="check" viewBox="0 0 24 24" fill="#15803d"><path d="M12 2l2.4 1.8 3 .1 .9 2.9 2.4 1.8-.9 2.9.9 2.9-2.4 1.8-.9 2.9-3 .1L12 22l-2.4-1.8-3-.1-.9-2.9-2.4-1.8.9-2.9-.9-2.9 2.4-1.8.9-2.9 3-.1z" opacity=".25"/><path d="M9.5 12.5l2 2 4-4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="sub"><b>4.9</b> · 312 sales · verified ID</span>
        </div>
        <span class="ship">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>
          CH · 9.–
        </span>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" aria-label="Save listing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="btn btn-primary">Place bid</button>
      </div>
    </div>
  </div>
</body>
</html>
