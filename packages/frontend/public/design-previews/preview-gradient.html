<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gradient — design preview · 400×300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     GRADIENT DESIGN SYSTEM — 400×300 THUMBNAIL
     Smooth color transitions · gradient-rich surfaces · depth
     ============================================================ */
  :root {
    --gr-primary: #990FFA;
    --gr-primary-deep: #7C00D1;
    --gr-primary-light: #B84EFF;
    --gr-secondary: #E60076;
    --gr-secondary-deep: #C40063;
    --gr-secondary-light: #FF1A8C;
    --gr-success: #16A34A;
    --gr-warning: #D97706;
    --gr-danger: #DC2626;

    --gr-surface: #FFFFFF;
    --gr-surface-2: #FAFAFC;
    --gr-ink: #111827;
    --gr-ink-2: #374151;
    --gr-ink-3: #6B7280;
    --gr-ink-4: #9CA3AF;
    --gr-line: #E5E7EB;

    --gr-font: 'Montserrat', -apple-system, sans-serif;
    --gr-font-display: 'Space Grotesk', 'Montserrat', sans-serif;
    --gr-font-mono: 'JetBrains Mono', monospace;

    --gr-r-sm: 8px;
    --gr-r-md: 12px;
    --gr-r-lg: 18px;
    --gr-r-pill: 999px;

    --gr-sh-1: 0 2px 8px -2px rgba(153,15,250,0.12);
    --gr-sh-2: 0 8px 28px -6px rgba(153,15,250,0.25), 0 4px 10px -2px rgba(230,0,118,0.12);
    --gr-sh-float: 0 12px 36px -8px rgba(153,15,250,0.35);

    /* Signature gradients */
    --gr-grad-primary: linear-gradient(135deg, var(--gr-primary) 0%, var(--gr-secondary) 100%);
    --gr-grad-pink: linear-gradient(135deg, var(--gr-secondary) 0%, #FF6B9D 100%);
    --gr-grad-violet: linear-gradient(135deg, var(--gr-primary) 0%, #5B21B6 100%);
    --gr-grad-warm: linear-gradient(135deg, var(--gr-secondary) 0%, #F59E0B 100%);
    --gr-grad-cool: linear-gradient(135deg, var(--gr-primary) 0%, #3B82F6 100%);
    --gr-grad-text: linear-gradient(90deg, var(--gr-primary), var(--gr-secondary));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 400px;
    height: 300px;
    overflow: hidden;
  }

  body {
    font-family: var(--gr-font);
    font-size: 12px;
    color: var(--gr-ink);
    background: var(--gr-surface);
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    width: 400px;
    height: 300px;
    padding: 12px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 10px;
    position: relative;
    /* Subtle gradient wash on the whole canvas */
    background:
      radial-gradient(200px 130px at 100% 0%, rgba(153,15,250,0.08), transparent 60%),
      radial-gradient(200px 130px at 0% 100%, rgba(230,0,118,0.06), transparent 60%),
      var(--gr-surface);
  }

  /* ============ HEADER ============ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--gr-surface);
    border: 1px solid var(--gr-line);
    border-radius: var(--gr-r-pill);
    box-shadow: var(--gr-sh-1);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand__mark {
    width: 24px; height: 24px;
    border-radius: var(--gr-r-sm);
    background: var(--gr-grad-primary);
    display: grid; place-items: center;
    color: #fff;
    box-shadow: var(--gr-sh-2);
  }
  .brand__mark svg { width: 13px; height: 13px; }
  .brand__name {
    font-family: var(--gr-font-display);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand__name span {
    background: var(--gr-grad-text);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .nav {
    display: flex;
    gap: 2px;
    background: var(--gr-surface-2);
    padding: 3px;
    border-radius: var(--gr-r-pill);
  }
  .nav a {
    padding: 4px 11px;
    border-radius: var(--gr-r-pill);
    text-decoration: none;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--gr-ink-3);
    transition: all .15s ease;
  }
  .nav a:hover { color: var(--gr-ink); }
  .nav a.is-active {
    background: var(--gr-grad-primary);
    color: #fff;
    box-shadow: var(--gr-sh-2);
  }

  .avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--gr-grad-pink);
    display: grid; place-items: center;
    color: #fff;
    font-weight: 700;
    font-size: 9px;
  }

  /* ============ MAIN ============ */
  .main {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 10px;
    min-height: 0;
  }

  /* LEFT — gradient hero card */
  .hero {
    padding: 14px 16px;
    background: var(--gr-grad-primary);
    border-radius: var(--gr-r-lg);
    box-shadow: var(--gr-sh-float);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    position: relative;
    overflow: hidden;
    color: #fff;
  }
  /* Decorative gradient orb */
  .hero::after {
    content: "";
    position: absolute;
    top: -30px; right: -30px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.25);
  }
  /* Second orb */
  .hero::before {
    content: "";
    position: absolute;
    bottom: -40px; left: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,107,157,0.30);
    z-index: 0;
  }

  .hero__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    align-self: flex-start;
    padding: 3px 10px;
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: var(--gr-r-pill);
    font-family: var(--gr-font-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
  .hero__eyebrow::before {
    content: "✦";
  }

  .hero__title {
    font-family: var(--gr-font-display);
    font-size: 26px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: #fff;
    position: relative;
    z-index: 1;
    margin: 2px 0;
  }
  .hero__title em {
    font-style: normal;
    background: linear-gradient(90deg, #FFE066, #FFB84D);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero__sub {
    font-size: 10.5px;
    line-height: 1.5;
    color: rgba(255,255,255,0.85);
    max-width: 28ch;
    position: relative;
    z-index: 1;
  }

  .hero__cta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    position: relative;
    z-index: 1;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 30px;
    padding: 0 14px;
    border: none;
    border-radius: var(--gr-r-pill);
    font-family: var(--gr-font);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s ease;
  }
  .btn--white {
    background: #fff;
    color: var(--gr-primary-deep);
    box-shadow: 0 4px 14px -2px rgba(0,0,0,0.15);
  }
  .btn--white:hover { transform: translateY(-1px); }
  .btn--ghost {
    background: rgba(255,255,255,0.20);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
  }
  .btn svg { width: 11px; height: 11px; }

  /* RIGHT — gradient stat cards */
  .cards {
    display: grid;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 6px;
    min-height: 0;
  }
  .card {
    padding: 8px 12px;
    border-radius: var(--gr-r-md);
    display: flex;
    align-items: center;
    gap: 9px;
    overflow: hidden;
    position: relative;
    color: #fff;
  }
  .card--pink { background: var(--gr-grad-pink); box-shadow: 0 6px 20px -6px rgba(230,0,118,0.40); }
  .card--warm { background: var(--gr-grad-warm); box-shadow: 0 6px 20px -6px rgba(245,158,11,0.35); }
  .card--cool { background: var(--gr-grad-cool); box-shadow: 0 6px 20px -6px rgba(59,130,246,0.35); }

  .card__icon {
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.28);
    border-radius: var(--gr-r-sm);
    display: grid; place-items: center;
    color: #fff;
    flex-shrink: 0;
  }
  .card__icon svg { width: 14px; height: 14px; }
  .card__body { flex: 1; min-width: 0; }
  .card__label {
    font-family: var(--gr-font-mono);
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    line-height: 1;
  }
  .card__value {
    font-family: var(--gr-font-display);
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    margin-top: 2px;
    letter-spacing: -0.025em;
  }
  .card__value span {
    font-family: var(--gr-font);
    font-size: 11px;
    color: rgba(255,255,255,0.80);
    font-weight: 500;
  }
  .card__sub {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--gr-font-mono);
    font-size: 8.5px;
    font-weight: 700;
    color: rgba(255,255,255,0.90);
    margin-top: 1px;
  }
  .card__sub svg { width: 7px; height: 7px; }

  /* Progress bar in cool card */
  .progress {
    height: 4px;
    background: rgba(255,255,255,0.30);
    border-radius: var(--gr-r-pill);
    overflow: hidden;
    margin-top: 3px;
  }
  .progress__fill {
    height: 100%;
    background: #fff;
    border-radius: var(--gr-r-pill);
  }
</style>
</head>
<body>

<main class="frame" aria-label="Gradient design language preview">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="brand">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="4"/></svg>
      </span>
      <span class="brand__name">flux<span>.</span>io</span>
    </div>
    <nav class="nav" aria-label="Primary">
      <a href="#" class="is-active">Home</a>
      <a href="#">Studio</a>
      <a href="#">Pricing</a>
    </nav>
    <div class="avatar" aria-label="User">NL</div>
  </header>

  <!-- ===== MAIN ===== -->
  <section class="main">

    <!-- LEFT: gradient hero card -->
    <article class="hero">
      <span class="hero__eyebrow">✦ new · v2</span>
      <h1 class="hero__title">Colors that<br><em>flow</em>.</h1>
      <p class="hero__sub">Rich gradient surfaces, smooth transitions, vibrant depth — interfaces that feel alive and dimensional.</p>
      <div class="hero__cta">
        <button class="btn btn--white" type="button">
          Explore
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="btn btn--ghost" type="button">Demo</button>
      </div>
    </article>

    <!-- RIGHT: gradient stat cards -->
    <aside class="cards">

      <div class="card card--pink">
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        </div>
        <div class="card__body">
          <div class="card__label">Creators</div>
          <div class="card__value">12.8<span>k</span></div>
          <div class="card__sub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 11-11"/><path d="M11 6h6v6"/></svg>
            24%
          </div>
        </div>
      </div>

      <div class="card card--warm">
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
        </div>
        <div class="card__body">
          <div class="card__label">Engagement</div>
          <div class="card__value">94<span>%</span></div>
          <div class="progress"><div class="progress__fill" style="width:94%"></div></div>
        </div>
      </div>

      <div class="card card--cool">
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div class="card__body">
          <div class="card__label">Uptime</div>
          <div class="card__value">99.9<span>%</span></div>
          <div class="card__sub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            30d
          </div>
        </div>
      </div>

    </aside>

  </section>

</main>

</body>
</html>
