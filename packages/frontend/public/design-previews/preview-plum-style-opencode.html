<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Plum Style Opencode Preview</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 400px;
    height: 300px;
    overflow: hidden;
    background: #010403;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: #f2fff9;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .frame {
    position: relative;
    width: 400px;
    height: 300px;
    /* Transparent dark workspace — tiny green-blue edge light top-right only */
    background:
      radial-gradient(70% 50% at 100% 0%, rgba(110,231,249,0.04) 0%, rgba(110,231,249,0) 55%),
      radial-gradient(60% 60% at 0% 100%, rgba(108,243,181,0.03) 0%, rgba(108,243,181,0) 55%),
      linear-gradient(180deg, #090d0d 0%, #050807 60%, #010403 100%);
    overflow: hidden;
  }

  /* ---------- Left Rail ---------- */
  .rail {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 44px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 9px 0;
    background: linear-gradient(90deg, rgba(132,245,210,0.02) 0%, rgba(132,245,210,0) 100%);
    box-shadow: inset -1px 0 0 rgba(132,245,210,0.1);
    z-index: 3;
  }
  .brand {
    width: 28px; height: 28px; border-radius: 999px;
    display: grid; place-items: center; margin-bottom: 4px;
    background: rgba(132,245,210,0.05);
    box-shadow: inset 0 0 0 1px rgba(132,245,210,0.22), 0 0 12px rgba(108,243,181,0.16);
    color: #6cf3b5;
  }
  .brand svg { width: 15px; height: 15px; }

  .icon-btn {
    width: 28px; height: 28px; border-radius: 999px;
    display: grid; place-items: center;
    color: rgba(220,252,231,0.5);
    cursor: pointer; position: relative;
    transition: color 130ms ease, background 130ms ease, box-shadow 130ms ease;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { color: #f2fff9; background: rgba(132,245,210,0.06); }
  .icon-btn.active {
    color: #6cf3b5;
    background: rgba(108,243,181,0.08);
    box-shadow: inset 0 0 0 1px rgba(108,243,181,0.32);
  }
  /* Count badge — small and non-dominant */
  .icon-btn .badge {
    position: absolute; top: 2px; right: 2px;
    min-width: 12px; height: 12px; padding: 0 3px;
    border-radius: 999px;
    background: #6ee7f9; color: #050807;
    font-size: 7.5px; font-weight: 800; letter-spacing: 0;
    display: grid; place-items: center;
    box-shadow: 0 0 6px rgba(110,231,249,0.6);
    line-height: 1;
  }

  .rail-spacer { flex: 1; }

  .avatar {
    width: 26px; height: 26px; border-radius: 999px;
    background: linear-gradient(135deg, #18241f 0%, #0c1310 100%);
    box-shadow: inset 0 0 0 1px rgba(132,245,210,0.2);
    display: grid; place-items: center;
    color: rgba(220,252,231,0.78);
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: absolute;
    left: 44px; top: 0; right: 0; bottom: 0;
    padding: 12px 14px 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .title-block { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .eyebrow {
    font-size: 8px; font-weight: 700;
    letter-spacing: 1.6px; text-transform: uppercase;
    color: rgba(220,252,231,0.42);
  }
  .title {
    font-size: 13px; font-weight: 600; letter-spacing: -0.1px;
    color: #f2fff9;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.25;
  }
  .title .dim { color: rgba(220,252,231,0.42); font-weight: 500; }

  /* Route pill — current route visible at a glance */
  .route {
    display: inline-flex; align-items: center; gap: 5px;
    height: 18px; padding: 0 8px 0 6px; border-radius: 999px;
    background: rgba(110,231,249,0.1);
    box-shadow: inset 0 0 0 1px rgba(110,231,249,0.3);
    font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
    color: #6ee7f9;
  }
  .route .arr { color: rgba(110,231,249,0.6); }
  .route .sink { color: #f2fff9; }

  /* ---------- Glass panel ---------- */
  .panel {
    position: relative;
    border-radius: 14px;
    padding: 10px 11px 11px;
    background: rgba(10,18,16,0.68);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      inset 0 0 0 1px rgba(132,245,210,0.12),
      0 8px 24px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 6px;
  }

  /* Group header with small count badge */
  .group-head {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 2px 0;
  }
  .group-head .label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: rgba(220,252,231,0.6);
  }
  .group-head .count {
    height: 14px; min-width: 14px; padding: 0 4px;
    border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(132,245,210,0.08);
    box-shadow: inset 0 0 0 1px rgba(132,245,210,0.18);
    color: rgba(220,252,231,0.7);
    font-size: 7.5px; font-weight: 700; letter-spacing: 0.2px;
    line-height: 1;
  }
  .group-head .spacer { flex: 1; }
  .group-head .hint {
    font-size: 8px; font-weight: 600; letter-spacing: 0.3px;
    color: rgba(220,252,231,0.4);
  }

  /* Repeated rows — share one rhythm: icon well + label + value + caret */
  .rows { display: flex; flex-direction: column; gap: 3px; }
  .row {
    display: flex; align-items: center; gap: 7px;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    background: rgba(132,245,210,0.025);
    box-shadow: inset 0 0 0 1px rgba(132,245,210,0.08);
    cursor: pointer;
    position: relative;
    transition: background 130ms ease, box-shadow 130ms ease;
  }
  .row:hover {
    background: rgba(132,245,210,0.05);
    box-shadow: inset 0 0 0 1px rgba(132,245,210,0.16);
  }
  /* Active route: narrow green-blue glow at the row edge */
  .row.active {
    background: rgba(108,243,181,0.06);
    box-shadow:
      inset 0 0 0 1px rgba(108,243,181,0.3),
      inset 2px 0 0 #6cf3b5,
      0 0 14px rgba(110,231,249,0.1);
  }
  .icon-well {
    width: 16px; height: 16px; border-radius: 999px;
    flex-shrink: 0;
    display: grid; place-items: center;
    background: rgba(132,245,210,0.06);
    color: rgba(220,252,231,0.7);
  }
  .icon-well svg { width: 10px; height: 10px; }
  .row.active .icon-well {
    background: linear-gradient(135deg, #6cf3b5 0%, #6ee7f9 130%);
    color: #050807;
    box-shadow: 0 0 8px rgba(108,243,181,0.4);
  }
  .row .k {
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase;
    color: rgba(220,252,231,0.5);
    width: 40px; flex-shrink: 0;
  }
  .row .v {
    flex: 1; min-width: 0;
    font-size: 9.5px; font-weight: 600;
    color: #f2fff9;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .v .meta { color: rgba(220,252,231,0.45); font-weight: 500; margin-left: 5px; }
  .row .caret {
    width: 11px; height: 11px; flex-shrink: 0;
    color: rgba(220,252,231,0.42);
  }

  /* Status dot — tiny, color = state */
  .dot {
    width: 6px; height: 6px; border-radius: 999px;
    flex-shrink: 0;
  }
  .dot.run { background: #6cf3b5; box-shadow: 0 0 5px rgba(108,243,181,0.8); animation: pulse 1.2s ease-in-out infinite; }
  .dot.queue { background: #6ee7f9; box-shadow: 0 0 5px rgba(110,231,249,0.7); }
  .dot.warn { background: #f3c46b; box-shadow: 0 0 5px rgba(243,196,107,0.7); }
  .dot.idle { background: rgba(220,252,231,0.3); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ---------- Tool stream (compact, secondary timestamp) ---------- */
  .stream {
    display: flex; flex-direction: column; gap: 2px;
    padding: 4px 4px 2px;
  }
  .tool {
    display: flex; align-items: center; gap: 7px;
    height: 18px;
    padding: 0 7px;
    border-radius: 8px;
    color: rgba(220,252,231,0.7);
    font-size: 9px;
    position: relative;
  }
  .tool .name {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600;
    color: #f2fff9;
  }
  .tool .name .fn { color: rgba(220,252,231,0.55); font-weight: 500; }
  .tool .ts {
    font-size: 7.5px; font-weight: 600; letter-spacing: 0.2px;
    color: rgba(220,252,231,0.4);
    font-feature-settings: "tnum" 1;
    flex-shrink: 0;
  }
  .tool:hover { background: rgba(132,245,210,0.04); }
  .tool.err .name { color: #f3c46b; }

  /* ---------- Bottom action row ---------- */
  .actions { display: flex; align-items: center; gap: 6px; margin-top: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 11px; border-radius: 999px;
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.2px;
    color: rgba(220,252,231,0.72);
    background: rgba(132,245,210,0.04);
    box-shadow: inset 0 0 0 1px rgba(132,245,210,0.14);
    cursor: pointer;
    transition: background 130ms ease, box-shadow 130ms ease, color 130ms ease;
  }
  .pill svg { width: 11px; height: 11px; }
  .pill:hover {
    color: #f2fff9;
    background: rgba(132,245,210,0.08);
    box-shadow: inset 0 0 0 1px rgba(132,245,210,0.3);
  }
  .pill.primary {
    color: #050807;
    background: linear-gradient(135deg, #6cf3b5 0%, #6ee7f9 130%);
    box-shadow: 0 0 0 1px rgba(108,243,181,0.4), 0 0 14px rgba(110,231,249,0.22);
  }
  .pill.primary:hover { filter: brightness(1.04); }

  .icon-pill {
    width: 24px; height: 24px; border-radius: 999px;
    display: grid; place-items: center;
    color: rgba(220,252,231,0.5);
    background: rgba(132,245,210,0.03);
    box-shadow: inset 0 0 0 1px rgba(132,245,210,0.12);
    cursor: pointer;
    transition: color 130ms ease, background 130ms ease;
  }
  .icon-pill:hover { color: #f2fff9; background: rgba(132,245,210,0.08); }
  .icon-pill svg { width: 12px; height: 12px; }

  .actions .spacer { flex: 1; }
</style>
</head>
<body>
  <div class="frame">

    <!-- ============ LEFT RAIL ============ -->
    <nav class="rail" aria-label="Werkzeuge">
      <div class="brand" title="Plum · OpenCode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/>
          <path d="M8 6h8M7 8l4 8M17 8l-4 8"/>
        </svg>
      </div>
      <button class="icon-btn active" title="Route" aria-label="Route">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h4l4 10h6"/><path d="M17 16l4-3-4-3"/>
        </svg>
      </button>
      <button class="icon-btn" title="Catalog" aria-label="Catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="badge">12</span>
      </button>
      <button class="icon-btn" title="History" aria-label="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/>
        </svg>
      </button>
      <button class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
      </button>
      <div class="rail-spacer"></div>
      <div class="avatar" title="Benutzer">VA</div>
    </nav>

    <!-- ============ MAIN STAGE ============ -->
    <main class="stage">

      <div class="top">
        <div class="title-block">
          <span class="eyebrow">OpenCode · Routing</span>
          <h1 class="title">Session <span class="dim">/ nsGg-IXK</span></h1>
        </div>
        <span class="route">
          <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 12h8"/></svg>
          <span>anthropic</span>
          <span class="arr">→</span>
          <span class="sink">sonnet-4.5</span>
        </span>
      </div>

      <section class="panel">

        <!-- Group 1: Provider / Model / Agent -->
        <div class="group-head">
          <span class="label">Engine</span>
          <span class="count">3</span>
          <span class="spacer"></span>
          <span class="hint">42ms RTT</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="icon-well">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 7v10l8 5 8-5V7z"/></svg>
            </div>
            <span class="k">Provider</span>
            <span class="v">anthropic</span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </div>
          <div class="row active">
            <div class="icon-well">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"/></svg>
            </div>
            <span class="k">Model</span>
            <span class="v">claude-sonnet-4.5<span class="meta">· 200k</span></span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </div>
          <div class="row">
            <div class="icon-well">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="M12 2v4M8 12h.01M16 12h.01M9 16h6"/></svg>
            </div>
            <span class="k">Agent</span>
            <span class="v">general<span class="meta">· max effort</span></span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </div>
        </div>

        <!-- Group 2: Tool stream -->
        <div class="group-head">
          <span class="label">Tools</span>
          <span class="count">2</span>
          <span class="spacer"></span>
          <span class="hint">last 60s</span>
        </div>
        <div class="stream">
          <div class="tool">
            <span class="dot run"></span>
            <span class="name">Read<span class="fn"> · plum-preview-opencode.html</span></span>
            <span class="ts">0:02</span>
          </div>
          <div class="tool">
            <span class="dot queue"></span>
            <span class="name">Bash<span class="fn"> · rg --type css</span></span>
            <span class="ts">queued</span>
          </div>
          <div class="tool">
            <span class="dot idle"></span>
            <span class="name">Edit<span class="fn"> · stage.css</span></span>
            <span class="ts">0:08</span>
          </div>
        </div>

      </section>

      <div class="actions">
        <button class="pill primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v16l4-3 3 4 3-4 4 3V3z"/></svg>
          Run turn
        </button>
        <button class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Switch model
        </button>
        <div class="spacer"></div>
        <button class="icon-pill" title="Stop" aria-label="Stop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="icon-pill" title="Mehr" aria-label="Mehr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
