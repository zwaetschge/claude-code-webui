# Project-wide Gradle settings

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# The Android Builder invokes `clean assembleDebug` in one command. Keeping
# project parallelism off prevents clean from racing assemble tasks on shared
# workspace mounts.
org.gradle.parallel=false

# Builder jobs reuse this project across Android Gradle Plugin updates. A persisted
# configuration cache can then reference plugin classes that no longer exist and
# fail before Kotlin compilation starts, so favour reproducible APK builds here.
org.gradle.configuration-cache=false

# Non-transitive R classes
android.nonTransitiveRClass=true
